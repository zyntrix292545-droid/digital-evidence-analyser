<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Evidence Analyzer</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #00ff88;
            --font-family: "Courier New", Courier, monospace;
            --card-bg: #1a1a1a;
            --border-glow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            --error-color: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--text-color);
            box-shadow: var(--border-glow);
            padding: 30px;
            border-radius: 8px;
            background-color: #0d0d0d;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .title-box h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .title-box p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* UPLOAD SECTION */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drop-zone {
            border: 2px dashed var(--text-color);
            border-radius: 8px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(0, 255, 136, 0.05);
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background-color: rgba(0, 255, 136, 0.15);
            box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .file-input {
            display: none;
        }

        .file-info {
            text-align: center;
            font-size: 1.1rem;
            min-height: 24px;
        }

        .btn-analyze {
            background-color: var(--text-color);
            color: black;
            font-family: var(--font-family);
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-analyze:hover:not(:disabled) {
            background-color: #00cc6a;
            box-shadow: 0 0 15px var(--text-color);
        }

        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* LOADING SECTION */
        .loading-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 136, 0.3);
            border-top: 4px solid var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* RESULTS SECTION */
        .results-section {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            padding: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px dashed rgba(0, 255, 136, 0.5);
            padding-bottom: 10px;
        }

        .metadata-table {
            width: 100%;
            border-collapse: collapse;
        }

        .metadata-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .metadata-table td:first-child {
            font-weight: bold;
            width: 40%;
        }

        .stego-status {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .stego-warning {
            color: var(--error-color);
            background-color: rgba(255, 51, 51, 0.1);
            border: 1px solid var(--error-color);
        }

        .stego-clear {
            color: var(--text-color);
            background-color: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--text-color);
        }

        .findings-list {
            list-style-type: square;
            padding-left: 20px;
        }

        .findings-list li {
            margin-bottom: 8px;
        }

        .btn-download {
            display: inline-block;
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            width: 100%;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-download:hover {
            background-color: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .btn-reset {
            background-color: transparent;
            color: var(--text-color);
            border: 1px dashed var(--text-color);
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: rgba(0, 255, 136, 0.1);
        }

        /* ERROR BOX */
        .error-box {
            display: none;
            color: var(--error-color);
            border: 1px solid var(--error-color);
            background-color: rgba(255, 51, 51, 0.1);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="title-box">
                <h1>🔍 Digital Evidence Analyzer</h1>
                <p>Forensic File Intelligence System</p>
            </div>
            <div class="live-indicator">
                <div class="dot"></div>
                LIVE
            </div>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="upload-section" id="uploadSection">
            <div class="drop-zone" id="dropZone">
                <p>Drop any file here or click to upload</p>
                <input type="file" class="file-input" id="fileInput">
            </div>
            <div class="file-info" id="fileInfo">No file selected</div>
            <button class="btn-analyze" id="analyzeBtn" disabled>⚡ ANALYZE FILE</button>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="spinner"></div>
            <p>Analyzing file... please wait</p>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="card">
                <h2>FILE METADATA</h2>
                <table class="metadata-table" id="metadataTable">
                    <!-- Metadata rows will be injected here -->
                </table>
            </div>

            <div class="card">
                <h2>STEGANOGRAPHY ANALYSIS</h2>
                <div id="stegoStatus" class="stego-status"></div>
                <ul class="findings-list" id="stegoFindings">
                    <!-- Findings will be injected here -->
                </ul>
            </div>

            <div class="card">
                <h2>FORENSIC REPORT</h2>
                <a href="#" id="downloadBtn" class="btn-download" target="_blank">📄 Download Forensic PDF Report</a>
            </div>

            <button class="btn-reset" id="resetBtn">🔄 Analyze Another File</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');

        const uploadSection = document.getElementById('uploadSection');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const errorBox = document.getElementById('errorBox');
        const resetBtn = document.getElementById('resetBtn');

        const metadataTable = document.getElementById('metadataTable');
        const stegoStatus = document.getElementById('stegoStatus');
        const stegoFindings = document.getElementById('stegoFindings');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentFile = null;

        // --- Drag and Drop Handlers ---
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function handleFileSelect(file) {
            currentFile = file;
            fileInfo.innerHTML = `<strong>${file.name}</strong> (${formatBytes(file.size)})`;
            analyzeBtn.disabled = false;
            errorBox.style.display = 'none';
        }

        // --- Analysis ---
        analyzeBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            // UI transitions
            uploadSection.style.display = 'none';
            errorBox.style.display = 'none';
            loadingSection.style.display = 'flex';

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to analyze file');
                }

                displayResults(data);

            } catch (err) {
                showError(err.message);
            }
        });

        function displayResults(data) {
            loadingSection.style.display = 'none';
            resultsSection.style.display = 'flex';

            // 1. Populate Metadata
            metadataTable.innerHTML = '';
            if (data.metadata) {
                for (const [key, value] of Object.entries(data.metadata)) {
                    // Format the key (e.g. file_size -> File Size)
                    const formattedKey = key.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${formattedKey}</td><td>${value}</td>`;
                    metadataTable.appendChild(tr);
                }
            }

            // 2. Populate Steganography
            if (data.steganography) {
                const detected = data.steganography.detected;

                stegoStatus.className = 'stego-status ' + (detected ? 'stego-warning' : 'stego-clear');
                stegoStatus.innerText = detected ? '⚠️ WARNING: Hidden Data Detected!' : '✅ CLEAR: No Hidden Data Found';

                stegoFindings.innerHTML = '';
                const findings = data.steganography.findings || [];
                findings.forEach(finding => {
                    const li = document.createElement('li');
                    li.innerText = finding;
                    stegoFindings.appendChild(li);
                });
            }

            // 3. Set Report Download Link
            if (data.report) {
                downloadBtn.href = `/download/${encodeURIComponent(data.report)}`;
            }
        }

        function showError(message) {
            loadingSection.style.display = 'none';
            uploadSection.style.display = 'flex';
            errorBox.style.display = 'block';
            errorBox.innerText = `Error: ${message}`;
        }

        // --- Reset ---
        resetBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            fileInfo.innerText = 'No file selected';
            analyzeBtn.disabled = true;

            resultsSection.style.display = 'none';
            errorBox.style.display = 'none';
            uploadSection.style.display = 'flex';
        });
    </script>

</body>

</html>
